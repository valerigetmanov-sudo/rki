<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отзывы участников конференции «РКИ детям»</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:white;color:#252941;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#rki-reviews{--ink:#252941;--muted:#7d859e;--blue:#5273f0;--lav:#9d91e7;position:relative;isolation:isolate;overflow:hidden;padding:55px clamp(12px,4.5vw,76px) 70px;background:radial-gradient(ellipse 300px 460px at -5% 28%,#e9eeff99,transparent 80%),radial-gradient(ellipse 300px 430px at 104% 72%,#eeeafd90,transparent 80%),#fff}
#rki-reviews .inner{max-width:1280px;margin:auto;position:relative}
#rki-reviews .header{position:relative;text-align:center;padding:0 100px 29px}
#rki-reviews .eyebrow{margin:0 0 12px;letter-spacing:.15em;font-size:11px;font-weight:700;color:#788cf5;text-transform:uppercase}
#rki-reviews h2{font-weight:800;letter-spacing:-.035em;font-size:clamp(27px,3vw,39px);line-height:1.17;margin:0 auto 12px;color:var(--ink)}
#rki-reviews .subheading{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
#rki-reviews .plane{position:absolute;right:2%;top:-14px;width:133px;height:98px;pointer-events:none;opacity:.9}
#rki-reviews .stage{background:#fff;border:1px solid #eff0fa;border-radius:29px;padding:19px 15px 19px 23px;box-shadow:0 12px 55px rgba(57,67,110,.075);display:flex;gap:14px;min-width:0}
#rki-reviews .window{height:595px;position:relative;min-width:0;flex:1;border-radius:17px;overflow:hidden}
#rki-reviews .scroller{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;overscroll-behavior-y:auto;outline-offset:-3px;padding:0 5px 18px}
#rki-reviews .scroller::-webkit-scrollbar{display:none}
#rki-reviews .columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:16px}
#rki-reviews .column{display:flex;flex-direction:column;gap:16px;min-width:0}
#rki-reviews .column:nth-child(2){padding-top:0}
#rki-reviews .column:nth-child(3){padding-top:0}
#rki-reviews .review{background:#f5f7ff;border:1px solid #edf0fc;border-radius:21px;padding:20px 21px 20px;box-shadow:0 5px 17px rgba(67,77,118,.055);min-width:0}
#rki-reviews .review[data-tone="lavender"]{background:#f6f2ff;border-color:#f0ebff}
#rki-reviews .review[data-tone="peach"]{background:#fffbf4;border-color:#faf3e9}
#rki-reviews .review[data-tone="blue"]{background:#f1f7ff;border-color:#ebf2ff}
#rki-reviews .review[data-tone="mist"]{background:#f7f9fd;border-color:#edf1f7}
#rki-reviews .mark{display:block;font-family:Georgia,serif;font-size:36px;line-height:.7;color:#9f9bea;height:27px;font-weight:bold;pointer-events:none}
#rki-reviews .review[data-tone="peach"] .mark{color:#e7b38e}
#rki-reviews .review[data-tone="blue"] .mark{color:#91b4f2}
#rki-reviews .review[data-tone="mist"] .mark{color:#a3afe0}
#rki-reviews .quote{font-size:14px;line-height:1.58;font-weight:400;color:#333b58;margin:10px 0 18px;overflow-wrap:break-word;white-space:normal}
#rki-reviews .person{font-weight:730;color:#2d3557;font-size:13px;line-height:1.35}
#rki-reviews .email{font-size:12px;line-height:1.6;color:#8894ae;margin-top:2px}
#rki-reviews .mask{display:inline-flex;position:relative;vertical-align:-.11em;margin:0 0 0 1px;height:1.02em;width:3.5em;overflow:hidden;border-radius:5px;background:linear-gradient(90deg,#dde4f3cc,#d3ddef88,#e0e7f5bb);isolation:isolate}
#rki-reviews .mask:before{content:"нзтлвиам";position:absolute;inset:-1px -3px;font:600 .88em/1.1 Arial,sans-serif;color:#889cc3;letter-spacing:-.065em;filter:blur(3.8px);opacity:.62;white-space:nowrap;transform:scaleX(1.12);pointer-events:none;user-select:none}
#rki-reviews .mask:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff30 48%,transparent);filter:blur(3px)}
#rki-reviews .mask.mailmask{width:4.25em}
#rki-reviews .fade{position:absolute;left:0;right:0;height:78px;z-index:3;pointer-events:none}
#rki-reviews .fade.top{top:0;background:linear-gradient(#fff 0%,rgba(255,255,255,.0) 100%);opacity:0;transition:opacity .18s ease}
#rki-reviews .window.has-scrolled .fade.top{opacity:1}
#rki-reviews .fade.bottom{bottom:0;background:linear-gradient(rgba(255,255,255,0) 0%,#fff 100%)}
#rki-reviews .controls{width:65px;flex:0 0 65px;display:flex;align-items:center;flex-direction:column;gap:10px;padding:3px 0 3px}
#rki-reviews .arrow{flex:0 0 44px;width:46px;display:grid;place-items:center;border-radius:50%;border:1px solid #e1e8ff;background:#f5f7ff;box-shadow:0 3px 9px #5365b718;color:#536ef0;font-weight:bold;font-size:24px;cursor:pointer;line-height:1}
#rki-reviews .arrow:hover{background:#eaf0ff}
#rki-reviews .track{position:relative;flex:1;width:40px;min-height:140px;border-radius:22px;border:2px solid #c7d7ff;background:#e5edff;box-shadow:inset 0 0 0 4px #f5f8ff;cursor:pointer;touch-action:none}
#rki-reviews .thumb{position:absolute;top:0;left:2px;right:2px;height:112px;border-radius:20px;background:linear-gradient(180deg,#839cff 0%,#4771f2 100%);border:2px solid #f9faff;box-shadow:0 3px 11px #5273ed78;cursor:grab;touch-action:none}
#rki-reviews .thumb:active{cursor:grabbing}
#rki-reviews .closing{text-align:center;margin:21px 0 0;color:#6477e9;font-weight:600;font-size:14px}
@media(max-width:950px){
 #rki-reviews .header{padding:0 72px 28px}
 #rki-reviews .columns{gap:10px}
 #rki-reviews .column{gap:10px}
 #rki-reviews .review{padding:17px}
 #rki-reviews .quote{font-size:13px}
}
@media(max-width:650px){
 #rki-reviews{padding:40px 12px 45px}
 #rki-reviews .header{padding:0 6px 22px}
 #rki-reviews .plane{right:-4px;top:-35px;width:70px;opacity:.45}
 #rki-reviews .eyebrow{font-size:10px}
 #rki-reviews h2{font-size:27px}
 #rki-reviews .subheading{font-size:12px}
 #rki-reviews .stage{padding:11px 7px 11px 11px;gap:7px;border-radius:22px}
 #rki-reviews .window{height:560px}
 #rki-reviews .columns{grid-template-columns:minmax(0,1fr);gap:9px}
 #rki-reviews .column{gap:9px}
 #rki-reviews .column:nth-child(2){padding-top:0}
 #rki-reviews .column:nth-child(3){display:flex;padding-top:0}
 #rki-reviews .review{padding:13px 12px;border-radius:14px}
 #rki-reviews .quote{font-size:12px;margin:7px 0 14px}
 #rki-reviews .person{font-size:11px}
 #rki-reviews .email{font-size:10px}
 #rki-reviews .controls{width:43px;flex-basis:43px;gap:8px}
 #rki-reviews .arrow{width:34px;flex-basis:36px;font-size:21px}
 #rki-reviews .track{width:32px}
 #rki-reviews .thumb{height:90px}
 #rki-reviews .closing{font-size:13px}
}
@media(max-width:380px){
 #rki-reviews .columns{grid-template-columns:1fr}
 #rki-reviews .column:nth-child(2){display:none}
}
@media(prefers-reduced-motion:reduce){#rki-reviews .scroller{scroll-behavior:auto}}
</style>
</head>
<body>
<section id="rki-reviews" aria-labelledby="rki-reviews-title">
 <div class="inner">
  <header class="header">
   <p class="eyebrow">Отзывы участников 2025</p>
   <h2 id="rki-reviews-title">Что говорят участники наших конференций</h2>
   <p class="subheading">Реальные впечатления преподавателей после конференции «РКИ детям» 2025 года</p>
   <svg class="plane" viewBox="0 0 155 110" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <path d="M 9 79 C 24 102, 63 106, 62 74 C 61 48, 27 52, 31 77 C 36 102, 94 97, 105 52" stroke="#B4B9FA" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8"/>
    <path d="M 67 35 L 144 7 L 112 73 L 101 48 L 67 35Z" fill="#E8E7FF" stroke="#938DF1" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M 101 48 L 144 7 L 91 61 L 101 48Z" fill="#9CA7FC" stroke="#938DF1" stroke-width="1.5"/>
   </svg>
  </header>
  <div class="stage">
   <div class="window">
    <div class="scroller" id="review-scroll" tabindex="0" aria-label="Вертикальная галерея отзывов">
     <div class="columns" id="review-columns"><div class="column"></div><div class="column"></div><div class="column"></div></div>
    </div>
    <div class="fade top"></div><div class="fade bottom"></div>
   </div>
   <div class="controls">
    <button class="arrow" id="review-up" aria-label="Прокрутить отзывы вверх">⌃</button>
    <div class="track" id="review-track" role="scrollbar" aria-label="Полоса прокрутки отзывов" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
     <div class="thumb" id="review-thumb"></div>
    </div>
    <button class="arrow" id="review-down" aria-label="Прокрутить отзывы вниз">⌄</button>
   </div>
  </div>
  <p class="closing">И это только малая часть отзывов!</p>
 </div>
</section>
<script>
(function(){
 const reviews = [["Анна","Ко","mo","yandex.ru","Мне хочется выразить огромную благодарность всем спикерам и организаторам за методические выходные. Мне было очень интересно. Я почерпнула множество идей для себя и зарядилась вдохновением. Новый этап моей профессиональной деятельности получил мощнейший заряд! Спасибо!"],["Алёна","Як","al","gmail.com","Спасибо большое! Очень понравилось, что реальные примеры материалов, ссылок и учебников, а не только теор часть. Еще очень приятно когда в выступлениях есть простой «человеческий тон». Даже удаленный формат сближает )"],["Варвара","Ши","vv","mail.ru","Всё было очень познавательно и ёмко, понравилась вовлечённость спикеров в то, чем они занимаются, искренняя любовь к делу и ученикам. Для меня такое эмоциональное инфополе сейчас очень важно, так как планирую расширить свой репертуар преподавания РКИ работой с детьми. А дети для меня — понятие terra incognita. За эти два дня они стали ближе :)))"],["Полина","Ли","po","gmail.com","Так как я не веду онлайн уроки, в первую очередь интересуют моменты, связанные с методикой проведения живых уроков, в оффлайн формате. В общем и целом, получила поддержку по многим вопросам от практикующих специалистов, записи тоже будут полезны."],["Вера","Ли","ka","gmail.com","Понравились темы с чистой практикой и практическими советами по играм с детьми. Спасибо."],["Кристина","Кл","ak","yandex.ru","Очень понравилось — всё чётко и по делу. Современные методики, талантливые молодые преподаватели. С удовольствием приму участие в подобных конференциях в следующий раз."],["Надежда","Па","na","mail.ru","Большое спасибо за мероприятие всем участникам и практико-ориентированные доклады! Все темы по-своему важны и интересны. Особенно те, которые связаны с инструментами работы с помощью современных технологий, методические находки всегда привлекательны и вдохновляют."],["Виктория","Пи","bl","yahoo.com","Мне нравится практическая направленность подобных мероприятий. А ещё хотелось бы больше вебинаров об организации работы с аудио и видео материалами, а также о механике процесса создания этих материалов с помощью ИИ. Спасибо!"],["Надежда","Са","ns","mail.ru","Интересно было услышать про различные игровые формы и методики работы — это актуально для всех возрастов при изучении иностранных языков. Спасибо огромное за организацию мероприятия!"],["Полина","Пе","po","gmail.com","Понравились доклады про театрализацию на занятиях и использование ИИ в подготовке учебных заданий и листов. Очень актуальная тема. Спасибо за ссылку на ценный ресурс ЩаСпоем!"],["Алёна","Хв","hv","gmail.com","Спасибо большое за очень полезный вебинар и интересных спикеров! Всегда работала со взрослыми студентами, не решалась, сомневалась начать обучение с детьми-билингвами. Надеюсь, этот вебинар будет первым шагом в обучении детей-билингвов."],["Надежда","Жу","NA","yandex.ru","Очень актуальны были идеи как раз для работы с детьми! Куча полезной информации, куча идей, спасибо большое за конференцию"],["Любовь","Ша","sh","ya.ru","Атмосфера на конференции очень доброжелательная, узнала для себя много нового и получила полное вдохновение от выступления коллег! Спасибо большое организаторам за такую интересную конференцию!"],["Елена","Фе","he","mail.ru","Понравилось разнообразие тем. Интересно было бы посмотреть открытые уроки для детей-билингвов. Спасибо за возможность получить новые знания и идеи от опытных коллег."],["Юлия","Ро","jo","mail.ru","Я никогда не работала с детьми и даже обычного общения не так много, поэтому море открытий!"],["Мария","Со","ma","gmail.com","Понравилась организация конференции, актуальные темы в нише преподавания именно детям!"],["Анастасия","Ио","an","gmail.com","Все супер! Спасибо! Хочу работать с детьми, и вот пытаюсь разобраться, как это делать! Вы молодцы!"],["Наталья","Вы","na","yandex.ru","Я была только на 1 дне и мне очень понравились доклады Натальи Черкай и Полины Макаровой. Второй день буду смотреть в записи. Спасибо Оле и всей команде за организацию такого замечательного мероприятия!"],["Лариса","Ба","lb","gmail.com","Много интересных идей, требующих осмысления! Спасибо!!!"],["Снежанна","Мо","sn","gmail.com","Спасибо, все понравилось, сверх ожиданий!"],["Светлана","Че","sv","gmail.com","Безумно интересно было. Столько идей и советов! Всем спасибо!"],["Анастасия","Ве","an","gmail.com","Замечательная конференция! Спасибо большое, хотелось бы почаще устраивать такие конференции, посвященные детям."],["Татьяна","Уд","ak","mail.ru","Понравилась тема семинара, она и привлекла. Подбор экспертов хорош на всех ваших мероприятиях, спасибо"],["Ирина","Гр","ig","yandex.ru","Очень интересные темы про использование искусственного интеллекта, а также внедрение различных видов сюжетных уроков:)"]];
 const base = document.getElementById('rki-reviews');
 const cols = Array.from(base.querySelectorAll('.column'));
 const scroller = document.getElementById('review-scroll');
 const track = document.getElementById('review-track');
 const thumb = document.getElementById('review-thumb');
 const safe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const mask=which=>'<span class="mask'+(which==='email'?' mailmask':'')+'" aria-label="часть скрыта"></span>';
 reviews.forEach((r,i)=>{
  const item=document.createElement('article');
  item.className='review';
  item.dataset.tone=['lavender','peach','blue','mist','lavender','blue','peach','mist'][i%8];
  item.innerHTML='<span class="mark" aria-hidden="true">“</span><p class="quote">'+safe(r[4])+'</p><div class="person">'+safe(r[0])+' '+safe(r[1])+mask('name')+'</div><div class="email">'+safe(r[2])+mask('email')+'@'+safe(r[3])+'</div>';
  cols[i%3].appendChild(item);
 });
 const maximum=()=>Math.max(0,scroller.scrollHeight-scroller.clientHeight);
 const thumbSpace=()=>Math.max(1,track.clientHeight-thumb.clientHeight);
 function update(){
  const fraction=maximum()===0?0:scroller.scrollTop/maximum();
  thumb.style.top=(fraction*thumbSpace())+'px';
  track.setAttribute('aria-valuenow',String(Math.round(fraction*100)));
  scroller.parentElement.classList.toggle('has-scrolled',scroller.scrollTop>10);
 }
 scroller.addEventListener('scroll',update,{passive:true});
 const move=amount=>scroller.scrollBy({top:amount,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 document.getElementById('review-up').addEventListener('click',()=>move(-290));
 document.getElementById('review-down').addEventListener('click',()=>move(290));
 track.addEventListener('click',e=>{
  if(e.target===thumb)return;
  const rect=track.getBoundingClientRect();
  const fraction=Math.max(0,Math.min(1,(e.clientY-rect.top-thumb.clientHeight/2)/thumbSpace()));
  scroller.scrollTo({top:maximum()*fraction,behavior:'smooth'});
 });
 let grabbing=false,fromY=0,fromScroll=0;
 thumb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();grabbing=true;fromY=e.clientY;fromScroll=scroller.scrollTop;thumb.setPointerCapture(e.pointerId);scroller.style.scrollBehavior='auto'});
 thumb.addEventListener('pointermove',e=>{if(grabbing)scroller.scrollTop=fromScroll+(e.clientY-fromY)*maximum()/thumbSpace()});
 function finish(){grabbing=false;scroller.style.scrollBehavior='smooth'}
 thumb.addEventListener('pointerup',finish);
 thumb.addEventListener('pointercancel',finish);
 track.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='PageDown'||e.key==='PageUp'){
   e.preventDefault();move((e.key==='ArrowDown'||e.key==='PageDown'?1:-1)*(e.key.startsWith('Page')?400:140));
  }
 });
 window.addEventListener('resize',update);
 update();
})();
</script>
</body>
</html>
